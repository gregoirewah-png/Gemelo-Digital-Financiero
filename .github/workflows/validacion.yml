name: Validación del proyecto
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis y errores de Python
        run: |
          python -m pip install ruff==0.8.6
          python scripts/audit_repo.py
          python -m compileall -q src dags scripts tests
          ruff check --select E9,F63,F7,F82 src dags scripts tests
      - name: Construir imagen reproducible
        run: docker build -t gemelo-ci .
      - name: Ejecutar pruebas sin servicios externos
        run: docker run --rm --env-file .env.example --entrypoint python gemelo-ci -m pytest tests -q --ignore=tests/test_interfaces.py
